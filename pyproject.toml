[project]
name = "leetcode-coach"
version = "0.1.0"
description = "Personal LeetCode coaching app: state store, CLI, web UI, Claude Code bridge"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["coach*", "bridge*", "migrate*"]
