<!doctype html>
<html><head><meta charset="utf-8"><title>LeetCode Coach</title>
<style>
body{font:13px system-ui,sans-serif;width:300px;margin:12px}
label{display:block;margin-top:8px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:5px;margin-top:3px}
button{margin-top:10px;padding:6px 10px}
#out{margin-top:10px;min-height:1.4em}
</style></head><body>
<label>Token <input id="token" type="password" placeholder="python -m coach.cli ext-token" autocomplete="off"></label>
<label>Server URL <input id="url" value="http://127.0.0.1:8731"></label>
<button id="test">Test connection</button>
<div id="out"></div>
<script src="popup.js"></script>
</body></html>
