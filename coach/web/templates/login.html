{% extends "base.html" %}
{% block title %}Sign in · Coach{% endblock %}
{% block body %}
<section class="auth">
  <div class="card auth-card">
    <h1>Sign in</h1>
    <p class="sub">Your coach is waiting.</p>
    {% if error %}
    <div class="alert" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}
    <form class="auth-form" method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field">
        <label class="label" for="u">Username</label>
        <input class="input" id="u" name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="off" spellcheck="false" required {% if not error %}autofocus{% endif %} {% if error %}aria-invalid="true"{% endif %}>
      </div>
      <div class="field">
        <label class="label" for="p">Password</label>
        <input class="input" id="p" name="password" type="password" autocomplete="current-password" required {% if error %}autofocus aria-invalid="true"{% endif %}>
      </div>
      <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
    </form>
  </div>
</section>
{% endblock %}
