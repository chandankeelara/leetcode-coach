<div class="coach-banner{% if coach_online %} is-hidden{% endif %}" id="coach-banner" role="status" {% if coach_online %}hidden{% endif %}>
  <span class="cb-msg"><strong>Coach not connected.</strong> 1. Open Claude Code. 2. Type <code>/leetcode-coach:coach</code>. 3. Say 'next' here when the dot turns green.</span>
  <a class="cb-link" href="/help/connect">Setup</a>
</div>
<script src="/static/live.js"></script>
<script>
(function () {
  var b = document.getElementById("coach-banner");
  if (!b) return;
  var live, liveTxt;
  function els() { live = document.getElementById("live"); liveTxt = document.getElementById("live-txt"); }
  var off = b.hasAttribute("hidden") ? false : true;
  function apply() {
    els();
    b.hidden = !off;
    b.classList.toggle("is-hidden", !off);
    if (live && off) {
      live.dataset.state = "off"; live.title = "Coach not connected";
      if (liveTxt) liveTxt.textContent = "Offline";
    } else if (live) {
      live.title = "Connection to your coach";
      if (live.dataset.state === "off" && (!window.coachLive || coachLive.state() !== "failed")) {
        live.dataset.state = "on";
        if (liveTxt) liveTxt.textContent = "Live";
      }
    }
  }
  // presence comes from the live stream (hello + presence events); the server already
  // applies the 90 s heartbeat window, so one "offline" is authoritative.
  window.coachPresence = function (online) { off = !online; apply(); };
  function watch() {
    els();
    if (live) new MutationObserver(function () {
      if (off && (live.dataset.state !== "off" || (liveTxt && liveTxt.textContent !== "Offline"))) apply();
    }).observe(live, { attributes: true, childList: true, subtree: true, characterData: true });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", watch); else watch();
  if (!window.coachLive) return;
  coachLive.on("presence", function (d) { if (typeof d.online === "boolean") window.coachPresence(d.online); });
  coachLive.on("resync", function (d) {   // fallback tick while the stream is down
    if (typeof d.online === "boolean") return;
    fetch("/coach/status", { credentials: "same-origin" }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j) window.coachPresence(!!j.online); }).catch(function () {});
  });
})();
</script>
