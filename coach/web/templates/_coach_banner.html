<div class="coach-banner{% if coach_online %} is-hidden{% endif %}" id="coach-banner" role="status" {% if coach_online %}hidden{% endif %}>
  <span class="cb-msg"><strong>Coach not connected.</strong> 1. Open Claude Code. 2. Type <code>/leetcode-coach:coach</code>. 3. Say 'next' here when the dot turns green.</span>
  <a class="cb-link" href="/help/connect">Setup</a>
</div>
<script>
(function () {
  var b = document.getElementById("coach-banner");
  if (!b) return;
  var live = document.getElementById("live"), liveTxt = document.getElementById("live-txt");
  var offPolls = 0, confirmedOff = false;
  function apply() {
    b.hidden = !confirmedOff;
    b.classList.toggle("is-hidden", !confirmedOff);
    if (live && confirmedOff) {
      live.dataset.state = "off"; live.title = "Coach not connected";
      if (liveTxt) liveTxt.textContent = "Offline";
    } else if (live) { live.title = "Connection to your coach"; }
  }
  // exposed so the page's own /messages poll can feed it via the X-Coach-Online header
  window.coachPresence = function (online) {
    if (online) { offPolls = 0; confirmedOff = false; }
    else { offPolls++; if (offPolls >= 2) confirmedOff = true; }
    apply();
  };
  if (live) new MutationObserver(function () {
    if (confirmedOff && (live.dataset.state !== "off" || (liveTxt && liveTxt.textContent !== "Offline"))) apply();
  }).observe(live, { attributes: true, childList: true, subtree: true, characterData: true });
  var f0 = window.fetch;   // every /messages poll also carries the signal
  window.fetch = function (u) {
    var p = f0.apply(this, arguments);
    if (typeof u === "string" && u.indexOf("/messages") === 0)
      p.then(function (r) { var v = r.headers.get("X-Coach-Online"); if (v !== null) window.coachPresence(v === "1"); }, function () {});
    return p;
  };
  function tick() {
    fetch("/coach/status", { credentials: "same-origin" }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j) window.coachPresence(!!j.online); })
      .catch(function () {})
      .then(function () { setTimeout(tick, document.hidden ? 15000 : 5000); });
  }
  setTimeout(tick, 1500);
})();
</script>
