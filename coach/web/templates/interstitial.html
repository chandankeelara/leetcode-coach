{% extends "base.html" %}
{% block title %}Ready · Coach{% endblock %}
{% block topbar %}{% include "_coach_banner.html" %}{% endblock %}
{% block body %}
<section class="ready">
  <div class="ready-inner">
    <p class="ready-date" data-today></p>
    <h1 class="ready-title">Ready when you are.</h1>
    <p class="ready-sub">Clock starts the moment you open it.</p>
    <form class="ready-form" method="post" action="/solve">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn btn-primary ready-go" type="submit" autofocus>
        Next problem
      </button>
      <span class="ready-hint"><kbd>Enter</kbd> to open</span>
    </form>
    <div class="ready-foot">
      <a href="/dashboard">Dashboard</a>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
(function(){var el=document.querySelector("[data-today]");if(el)el.textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
var f=document.querySelector(".ready-form");f.addEventListener("submit",function(){var b=f.querySelector("button");b.classList.add("busy");b.textContent="Opening…";});})();
</script>
<script>
/* The coach can hand out a problem from the terminal: follow it to /solve. */
(function(){if(!window.coachLive)return;var going=false;
function check(){if(going)return;fetch("/handout/state",{credentials:"same-origin",cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(st){if(st&&st.open_handout_id!==null&&!going){going=true;location.href="/solve";}}).catch(function(){});}
coachLive.on("handout",check);coachLive.on("resync",function(d){if(d&&d.open_handout_id!==undefined){if(d.open_handout_id!==null&&!going){going=true;location.href="/solve";}}else check();});})();
</script>
{% endblock %}
