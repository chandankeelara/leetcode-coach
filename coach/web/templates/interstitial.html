{% extends "base.html" %}
{% block title %}Ready · Coach{% endblock %}
{% block topbar %}{% include "_coach_banner.html" %}{% endblock %}
{% block body %}
<section class="ready">
  <div class="ready-inner">
    <p class="ready-date" data-today></p>
    <h1 class="ready-title">Ready when you are.</h1>
    <p class="ready-sub">Clock starts the moment you open it.</p>
    <form class="ready-form" method="post" action="/solve">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn btn-primary ready-go" type="submit" autofocus>
        Next problem
      </button>
      <span class="ready-hint"><kbd>Enter</kbd> to open</span>
    </form>
    <div class="ready-foot">
      <a href="/dashboard">Dashboard</a>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
(function(){var el=document.querySelector("[data-today]");if(el)el.textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
var f=document.querySelector(".ready-form");f.addEventListener("submit",function(){var b=f.querySelector("button");b.classList.add("busy");b.textContent="Opening…";});})();
</script>
{% endblock %}
