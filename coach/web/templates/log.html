{% extends "base.html" %}
{% block body %}
<h1>Log attempt</h1>
<p>{{ h.number }}. {{ h.title }}</p>
<form method="post" action="/log">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Actual minutes <input name="actual_min" type="number" min="0" value="{{ minutes }}"></label>
<label>Bugs <input name="bugs" type="number" min="0" value="0"></label>
<label>Hints <input name="hints" type="number" min="0" value="0"></label>
<label>Complexity optimal?
<select name="optimal"><option value="yes">yes</option><option value="no">no</option></select></label>
<label>Derived the approach myself?
<select name="derived_cold"><option value="yes">yes</option><option value="no">no</option></select></label>
<label>Notes <textarea name="notes" rows="3"></textarea></label>
<label class="check"><input type="checkbox" name="abandoned" value="1" {% if abandoned %}checked{% endif %}> Abandoned</label>
<button>Log</button>
</form>
{% endblock %}
