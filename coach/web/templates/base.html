<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% block title %}Coach{% endblock %}</title>
<meta name="color-scheme" content="dark light">
<meta name="coach-headers" content='{"X-CSRF-Token": "{{ csrf }}"}'>
<script>
(function(){try{var t=localStorage.getItem("coach:theme");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Martian+Mono:wdth,wght@87.5,400..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
{% block head %}{% endblock %}
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2c94c'/%3E%3Cpath d='M21.5 11.2a7 7 0 1 0 0 9.6' fill='none' stroke='%23191714' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body class="{% block body_class %}{% endblock %}">
<div class="top">
<header class="nav">
  <a class="logo" href="/" aria-label="Coach home"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M16.6 8.2a6 6 0 1 0 0 7.6"/></svg></span><span class="logo-text">Coach</span></a>
  {% if nav == "full" %}
  <nav class="nav-links" aria-label="Main">
    <a href="/dashboard" {% if active == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a>
    <a href="/history" {% if active == "history" %}aria-current="page"{% endif %}>History</a>
  </nav>
  {% endif %}
  <div class="nav-end">
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle light or dark theme" title="Theme">
      <svg class="theme-ico-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="theme-ico-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    {% if authed %}
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn btn-quiet btn-sm logout" type="submit" title="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg><span>Log out</span></button>
    </form>
    {% endif %}
  </div>
</header>
{% block topbar %}{% endblock %}
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
{% if request.state.flash %}<p class="sr-only" data-flash data-variant="warn">{{ request.state.flash }}</p>{% endif %}
<main id="main">
{% block body %}{% endblock %}
</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
